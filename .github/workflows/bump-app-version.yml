name: Bump application version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-app-version-main
  cancel-in-progress: false

jobs:
  bump-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select application version
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current="$(cat VERSION)"
          if [[ ! "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a valid MAJOR.MINOR.PATCH value; got: $current" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_unchanged=true
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              echo "Unable to find the commit preceding this push: $BEFORE_SHA" >&2
              exit 1
            fi
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- VERSION; then
              version_unchanged=true
            else
              diff_status=$?
              if [[ "$diff_status" -ne 1 ]]; then
                echo "Unable to determine whether VERSION changed in this push." >&2
                exit "$diff_status"
              fi
              version_unchanged=false
            fi
          fi
          if [[ "$version_unchanged" == true ]]; then
            next="$major.$minor.$((patch + 1))"
            printf '%s\n' "$next" > VERSION
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            next="$current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - name: Commit updated version
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump application version to v${{ steps.version.outputs.value }}"
          git push origin main
